apiVersion: 1

# Mark provisioned data sources for deletion if they are no longer in a provisioning file.
# It takes no effect if data sources are already listed in the deleteDatasources section.
prune: true

datasources:
  - name: Local_Prometheus
    type: prometheus
    uid: P7E2AE7DB8179C128
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 1m
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo
    editable: false

  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      nodeGraph:
        enabled: true
      search:
        hide: false
      tracesToMetrics:
        datasourceUid: P7E2AE7DB8179C128
        tags:
          - key: service.name
            value: service
      serviceMap:
        datasourceUid: P7E2AE7DB8179C128
    editable: false