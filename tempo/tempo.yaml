server:
  http_listen_port: 3200
  log_level: info

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 168h

storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

query_frontend:
  search:
    duration_slo: 5s
    # Grafana "Span limit" (spss). Default 100 causes 400 when raised in the UI.
    max_spans_per_span_set: 1000
    # Grafana "Limit" (max traces returned). 0 = unlimited.
    max_result_limit: 10000
  trace_by_id:
    duration_slo: 5s
  # TraceQL metrics default is 3h; 0 = no max (still bounded by block_retention).
  metrics:
    max_duration: 0

metrics_generator:
  processor:
    local_blocks:
      # Include all spans (not only kind=server); n8n/AI traces are often internal/client.
      filter_server_spans: false
      # Persist RF1 blocks so TraceQL metrics can query beyond the live window.
      flush_to_storage: true
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  # Required by local-blocks (TraceQL metrics); separate from metrics WAL above.
  traces_storage:
    path: /var/tempo/generator/traces

overrides:
  metrics_generator_processors: [service-graphs, span-metrics, local-blocks]
